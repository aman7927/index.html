<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: mediastream:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>GEOHUNT STUDIO — Real 3D Clue Builder &amp; AR Hunt</title>
<style>
:root{
  --ink0:#070B09;--ink1:#0B110E;--sur:#101A16;--sur2:#15221D;--ovl:#1B2B24;
  --line:rgba(150,200,175,.14);--line2:rgba(150,200,175,.32);
  --bone:#E8E4D9;--mut:#93A79B;--dim:#5E7168;
  --amber:#FFB020;--mint:#5FE3A1;--coral:#FF6B5A;--sky:#6FC3FF;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bar:56px;--tele:34px;--rail:74px;--insp:322px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ink0);color:var(--bone);font-family:var(--sans);font-size:14px;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:#2A3B33 var(--ink1)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ink1)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#31463C,#1E2E27);border:2px solid var(--ink1);border-radius:7px}
::-webkit-scrollbar-thumb:hover{background:#3E5A4C}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono)}

#topo{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
   repeating-radial-gradient(circle at 18% 28%,transparent 0 38px,rgba(95,227,161,.055) 38px 39px),
   repeating-radial-gradient(circle at 82% 74%,transparent 0 46px,rgba(255,176,32,.045) 46px 47px),
   linear-gradient(rgba(150,200,175,.035) 1px,transparent 1px),
   linear-gradient(90deg,rgba(150,200,175,.035) 1px,transparent 1px),
   radial-gradient(ellipse 90% 70% at 50% 20%,#0D1714,#070B09 75%);
  background-size:auto,auto,52px 52px,52px 52px,auto}
#feed{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000;display:none}
#feed.on{display:block}
#view{position:fixed;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#frame{position:fixed;inset:0;z-index:3;pointer-events:none}
#frame .cn{position:absolute;width:26px;height:26px;border:2px solid rgba(255,176,32,.5)}
#frame .tl{top:calc(var(--bar) + 14px);left:calc(var(--rail) + 14px);border-right:0;border-bottom:0}
#frame .tr{top:calc(var(--bar) + 14px);right:calc(var(--insp) + 14px);border-left:0;border-bottom:0}
#frame .bl{bottom:calc(var(--tele) + 14px);left:calc(var(--rail) + 14px);border-right:0;border-top:0}
#frame .br{bottom:calc(var(--tele) + 14px);right:calc(var(--insp) + 14px);border-left:0;border-top:0}
#frame .cross{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);opacity:.35}
#frame .cross::before,#frame .cross::after{content:"";position:absolute;background:var(--amber)}
#frame .cross::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px)}
#frame .cross::after{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px)}
#sweep{position:fixed;left:0;right:0;height:120px;z-index:3;pointer-events:none;opacity:.5;
  background:linear-gradient(180deg,transparent,rgba(95,227,161,.07),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{0%{top:-120px}100%{top:100%}}

.bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:20;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:rgba(9,15,12,.92);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand .mk{width:28px;height:28px;border:1.5px solid var(--amber);border-radius:7px;display:grid;place-items:center;color:var(--amber);position:relative}
.brand .mk::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.brand b{font-size:15px;font-weight:900;letter-spacing:.06em}
.brand small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.modes{display:flex;gap:3px;margin-left:8px;background:var(--ink1);border:1px solid var(--line);border-radius:10px;padding:3px}
.modes button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:7px 14px;border-radius:7px;border:0;background:transparent;color:var(--mut);cursor:pointer;transition:.15s}
.modes button:hover{color:var(--bone)}
.modes button.on{background:linear-gradient(135deg,var(--amber),#E08800);color:#241500;font-weight:700}
.bar .sp{flex:1}
.led{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);padding:5px 9px;border-radius:99px}
.led i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.led.ok{color:var(--mint);border-color:rgba(95,227,161,.35)}.led.ok i{background:var(--mint);box-shadow:0 0 7px var(--mint)}
.led.warn{color:var(--amber);border-color:rgba(255,176,32,.35)}.led.warn i{background:var(--amber)}
.led.bad{color:var(--coral);border-color:rgba(255,107,90,.35)}.led.bad i{background:var(--coral)}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line2);background:var(--sur);color:var(--mut);cursor:pointer;transition:.15s}
.ib:hover{color:var(--bone);border-color:var(--amber);transform:translateY(-1px)}
.ib.on{color:var(--amber);border-color:var(--amber);background:rgba(255,176,32,.1)}

.rail{position:fixed;top:var(--bar);bottom:var(--tele);left:0;width:var(--rail);z-index:19;background:rgba(9,15,12,.86);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px}
.step{width:56px;padding:9px 0;border-radius:11px;border:1px solid var(--line);background:var(--ink1);color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.18s;position:relative}
.step:hover{color:var(--bone);border-color:var(--line2);transform:translateY(-2px)}
.step.on{color:var(--amber);border-color:var(--amber);background:rgba(255,176,32,.09);box-shadow:0 0 18px rgba(255,176,32,.12)}
.step .n{font-family:var(--mono);font-size:9px;letter-spacing:.1em}
.step .lb{font-family:var(--mono);font-size:8px;letter-spacing:.08em}
.step.done::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 7px var(--mint)}
.rail .grow{flex:1}

.insp{position:fixed;top:var(--bar);bottom:var(--tele);right:0;width:var(--insp);z-index:19;background:rgba(11,17,14,.93);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.pane{display:none;animation:fade .28s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.ph{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ph::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.psub{font-size:11.5px;color:var(--dim);margin-bottom:16px;line-height:1.5}
.grp{border:1px solid var(--line);border-radius:13px;background:linear-gradient(170deg,var(--sur2),var(--sur));padding:13px;margin-bottom:13px}
.grp>h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;margin-bottom:11px}
.c{margin-bottom:12px}.c:last-child{margin-bottom:0}
.cl{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.cl output{font-family:var(--mono);font-size:11px;color:var(--amber)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--ink0);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13px;outline:none;transition:.15s}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.1)}
input.big{font-size:17px;font-weight:800;letter-spacing:.02em}
textarea{font-family:var(--mono);font-size:10.5px;resize:vertical;min-height:64px;-webkit-user-select:text;user-select:text;line-height:1.5;word-break:break-all}
input[readonly]{color:var(--mint);-webkit-user-select:text;user-select:text}
select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--amber) var(--f,50%),#22332C var(--f,50%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#FFF3DC;border:3px solid var(--amber);box-shadow:0 0 9px rgba(255,176,32,.45);cursor:grab}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#FFF3DC;border:3px solid var(--amber)}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw b{width:25px;height:25px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:.15s}
.sw b:hover{transform:scale(1.1)}
.sw b.on{border-color:var(--bone);transform:scale(1.14)}
.sw input[type=color]{width:29px;height:25px;padding:0;border:1px solid var(--line2);border-radius:7px;background:none;cursor:pointer}
.tg{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;color:var(--mut);margin-bottom:9px}
.tg:last-child{margin-bottom:0}
.tg input{display:none}
.tg .tr{width:34px;height:19px;border-radius:99px;background:#22332C;border:1px solid var(--line2);position:relative;flex:none;transition:.2s}
.tg .tr::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--dim);transition:.2s}
.tg input:checked+.tr{background:#4A3410;border-color:var(--amber)}
.tg input:checked+.tr::after{left:17px;background:var(--amber);box-shadow:0 0 7px rgba(255,176,32,.6)}
.tg input:checked~span{color:var(--bone)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sur2);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--amber);transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.p{background:linear-gradient(135deg,var(--amber),#E08800);color:#241500;border:0}
.btn.g{background:linear-gradient(135deg,var(--mint),#2FBF80);color:#04231A;border:0}
.btn.d{color:#FFA79B;border-color:rgba(255,107,90,.4);background:rgba(255,107,90,.08)}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{font-size:10.5px;color:var(--dim);line-height:1.55;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.stat{font-family:var(--mono);font-size:10.5px;border-radius:9px;padding:8px 10px;margin-bottom:11px;border:1px solid var(--line);background:rgba(7,11,9,.5);color:var(--mut);line-height:1.6;word-break:break-all}
.stat.ok{color:var(--mint);border-color:rgba(95,227,161,.3);background:rgba(95,227,161,.06)}
.stat.warn{color:var(--amber);border-color:rgba(255,176,32,.3);background:rgba(255,176,32,.06)}
.stat.bad{color:var(--coral);border-color:rgba(255,107,90,.3);background:rgba(255,107,90,.06)}

.tele{position:fixed;bottom:0;left:0;right:0;height:var(--tele);z-index:20;display:flex;align-items:center;gap:16px;padding:0 14px;background:rgba(9,15,12,.94);border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--dim);overflow-x:auto;white-space:nowrap}
.tele span b{color:var(--bone);font-weight:600}
.tele span.g b{color:var(--mint)}.tele span.a b{color:var(--amber)}
.tele .sp{flex:1}

.fieldhud{position:fixed;left:calc(var(--rail) + 16px);bottom:calc(var(--tele) + 16px);z-index:18;display:none;gap:14px;align-items:flex-end}
.fieldhud.on{display:flex}
#radar{width:150px;height:150px;border-radius:50%;border:1px solid var(--line2);background:rgba(7,11,9,.8);box-shadow:0 10px 40px rgba(0,0,0,.55)}
.readout{background:rgba(7,11,9,.85);border:1px solid var(--line2);border-radius:13px;padding:12px 15px;min-width:172px}
.readout .d{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--amber);line-height:1}
.readout .d.found{color:var(--mint)}
.readout .u{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.16em;margin-top:3px}
.readout .s{font-size:11.5px;color:var(--mut);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);max-width:200px;line-height:1.45}
.banner{position:fixed;top:calc(var(--bar) + 18px);left:50%;transform:translateX(-50%) translateY(-14px);z-index:22;background:linear-gradient(135deg,var(--mint),#2FBF80);color:#04231A;font-weight:800;font-size:14px;padding:11px 22px;border-radius:12px;opacity:0;transition:.4s;pointer-events:none;box-shadow:0 12px 40px rgba(95,227,161,.3)}
.banner.on{opacity:1;transform:translateX(-50%) translateY(0)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(4,8,6,.86);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.28s}
.modal.on{opacity:1;pointer-events:auto}
.card{width:min(600px,100%);max-height:86vh;overflow-y:auto;background:var(--sur);border:1px solid var(--line2);border-radius:18px;padding:24px}
.card h2{font-size:21px;font-weight:800;margin-bottom:5px}
.card .sb{color:var(--mut);font-size:13px;margin-bottom:16px;line-height:1.55}
.card h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin:18px 0 9px}
.card ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
.card li{counter-increment:s;display:flex;gap:11px;font-size:12.5px;color:var(--mut);line-height:1.55}
.card li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:9.5px;color:var(--mint);border:1px solid rgba(95,227,161,.35);border-radius:6px;padding:2px 6px;height:fit-content;flex:none}
.card li b{color:var(--bone)}
.card code{font-family:var(--mono);font-size:11px;color:var(--amber);background:rgba(255,176,32,.09);padding:1px 5px;border-radius:4px}
.warnbox{border:1px solid rgba(255,176,32,.32);background:rgba(255,176,32,.06);border-radius:11px;padding:12px;font-size:12px;color:#FFD48A;line-height:1.6;margin-top:14px}
.toasts{position:fixed;top:calc(var(--bar) + 14px);left:50%;transform:translateX(-50%);z-index:45;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(21,34,29,.97);border:1px solid var(--line2);border-radius:11px;padding:10px 16px;font-size:12.5px;box-shadow:0 12px 36px rgba(0,0,0,.55);opacity:0;transform:translateY(-10px);transition:.28s;max-width:88vw;text-align:center}
.toast.in{opacity:1;transform:none}
.toast.ok{border-color:rgba(95,227,161,.5)}.toast.bad{border-color:rgba(255,107,90,.5)}.toast.warn{border-color:rgba(255,176,32,.5)}
.build{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:23;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--amber);background:rgba(7,11,9,.85);border:1px solid rgba(255,176,32,.35);padding:9px 16px;border-radius:10px;display:none}
.build.on{display:block}

@media(max-width:1080px){:root{--insp:290px}}
@media(max-width:860px){
  :root{--rail:0px;--insp:0px;--tele:30px}
  .rail{top:var(--bar);bottom:auto;left:0;right:0;width:auto;height:56px;flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .rail .grow{display:none}
  .step{width:auto;flex-direction:row;padding:8px 13px;gap:7px}
  .insp{top:auto;bottom:var(--tele);left:0;right:0;width:auto;max-height:44vh;border-left:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0}
  #frame .tl,#frame .bl{left:14px}#frame .tr,#frame .br{right:14px}
  #frame .tl,#frame .tr{top:calc(var(--bar) + 70px)}
  .fieldhud{left:12px;bottom:calc(44vh + var(--tele) + 12px);gap:10px}
  #radar{width:104px;height:104px}
  .readout{min-width:130px;padding:9px 12px}.readout .d{font-size:22px}
  .brand small{display:none}.modes button{padding:7px 10px;font-size:10px}
  .tele{gap:12px;font-size:9px}
}
.rm #sweep{display:none}
.rm *{animation-duration:.01ms!important;transition-duration:.01ms!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-txt" viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M8 20h8"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-shr" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.4 10.8 7.2-4.2M8.4 13.2l7.2 4.2"/></symbol>
<symbol id="i-rad" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 19 7"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2.5h6L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-cmp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.
